[browser]
gatherUsageStats = false

[server]
# Serves src/dashboard/static/ at app/static/ (the Command Center hero image).
enableStaticServing = true

[theme]
# Dark base so Streamlit's own widgets match the dashboard's dark design system.
base = "dark"
primaryColor = "#FF7A18"
backgroundColor = "#080B12"
secondaryBackgroundColor = "#111722"
textColor = "#E8EDF3"

[client]
# One application menu: the dashboard's own "⋮" (Appearance + Rerun / Clear cache / Print,
# src/dashboard/components/theme_switch). "minimal" is Streamlit's supported setting that hides
# its own toolbar menu and Deploy button; set back to "auto" to restore them.
toolbarMode = "minimal"
